<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Workforce Gap Chart</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f5f7fa;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 40px 20px;
    }

    .chart-container {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.10);
      padding: 48px 48px 40px;
      max-width: 780px;
      width: 100%;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 700;
      color: #1a1a2e;
      margin-bottom: 6px;
      text-align: center;
    }

    .subtitle {
      font-size: 0.88rem;
      color: #777;
      text-align: center;
      margin-bottom: 40px;
    }

    /* ── Chart area ────────────────────────────────────────────── */
    .chart-area {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      /* extra right padding so the gap label has room */
      padding-right: 260px;
      height: 360px;
      position: relative;
    }

    /* Baseline */
    .chart-area::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: #ddd;
    }

    /* ── Bars ──────────────────────────────────────────────────── */
    .bar-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      margin: 0 28px;
    }

    .bar-value {
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .bar {
      width: 90px;
      border-radius: 6px 6px 0 0;
      position: relative;
    }

    /* 12 M → 300 px  (full scale) */
    .bar-red {
      height: 300px;
      background: linear-gradient(180deg, #ef5350 0%, #b71c1c 100%);
    }

    /* 2 M  → 50 px   (2/12 × 300) */
    .bar-green {
      height: 50px;
      background: linear-gradient(180deg, #66bb6a 0%, #1b5e20 100%);
    }

    .bar-label {
      margin-top: 14px;
      font-size: 0.78rem;
      color: #555;
      text-align: center;
      max-width: 100px;
      line-height: 1.5;
    }

    /* ── Gap annotation ────────────────────────────────────────── */
    /*
     * The annotation is attached to the RED bar (position:relative).
     * The gap spans from y=50px (top of the green bar height) to y=300px
     * (bottom / baseline).  In CSS terms, measured from the TOP of the
     * red bar that is from top:0 to top:250px (300-50=250px gap).
     */
    .gap-bracket {
      position: absolute;
      /* right edge of the red bar, with a little offset */
      right: -18px;
      top: 0;           /* top of red bar = top of 12M mark */
      height: 250px;    /* gap = 300px - 50px */
      width: 12px;
      border-right: 3px solid #c62828;
      border-top: 3px solid #c62828;
      border-bottom: 3px solid #c62828;
      border-radius: 0 4px 4px 0;
    }

    .gap-label {
      position: absolute;
      right: -240px;    /* pushes label well to the right */
      top: 50%;
      transform: translateY(-50%);
      color: #c62828;
      text-align: left;
      line-height: 1.35;
      width: 210px;
    }

    .gap-label .gap-number {
      font-size: 2.6rem;
      font-weight: 800;
      display: block;
      letter-spacing: -1px;
    }

    .gap-label .gap-question {
      font-size: 0.88rem;
      font-weight: 600;
      display: block;
      margin-top: 2px;
    }

    /* ── Legend ────────────────────────────────────────────────── */
    .legend {
      display: flex;
      justify-content: center;
      gap: 32px;
      margin-top: 28px;
      flex-wrap: wrap;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.82rem;
      color: #444;
    }

    .legend-swatch {
      width: 14px;
      height: 14px;
      border-radius: 3px;
      flex-shrink: 0;
    }

    .swatch-red   { background: #ef5350; }
    .swatch-green { background: #66bb6a; }
  </style>
</head>
<body>
  <div class="chart-container">
    <h1>Africa's Workforce Gap</h1>
    <p class="subtitle">Annual figures — new entrants vs. formal jobs created</p>

    <div class="chart-area">

      <!-- ① Tall red bar: 12 million new workforce entrants -->
      <div class="bar-group">
        <div class="bar-value" style="color:#c62828;">12 million</div>
        <div class="bar bar-red">

          <!-- Gap bracket + label sits inside the red bar so it can use
               the bar's coordinate system for precise placement -->
          <div class="gap-bracket">
            <div class="gap-label">
              <span class="gap-number">10M</span>
              <span class="gap-question">Where do 10 million<br>people go every year?</span>
            </div>
          </div>

        </div>
        <div class="bar-label">New workforce<br>entrants per year</div>
      </div>

      <!-- ② Short green bar: 2 million formal jobs created -->
      <div class="bar-group">
        <div class="bar-value" style="color:#2e7d32;">2 million</div>
        <div class="bar bar-green"></div>
        <div class="bar-label">Formal jobs<br>created per year</div>
      </div>

    </div><!-- /.chart-area -->

    <div class="legend">
      <div class="legend-item">
        <div class="legend-swatch swatch-red"></div>
        New workforce entrants per year
      </div>
      <div class="legend-item">
        <div class="legend-swatch swatch-green"></div>
        Formal jobs created per year
      </div>
    </div>
  </div><!-- /.chart-container -->
</body>
</html>
