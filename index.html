<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Workforce Gap Chart</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 40px 20px;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.10);
      padding: 48px 56px 40px;
      max-width: 600px;
      width: 100%;
    }

    h1 {
      font-size: 1.25rem;
      color: #222;
      margin-bottom: 8px;
      font-weight: 700;
    }

    .subtitle {
      font-size: 0.9rem;
      color: #666;
      margin-bottom: 40px;
    }

    .chart {
      display: flex;
      align-items: flex-end;
      gap: 64px;
      height: 340px;
      position: relative;
      padding-bottom: 48px;
    }

    /* horizontal baseline */
    .chart::after {
      content: '';
      position: absolute;
      bottom: 48px;
      left: 0;
      right: 0;
      height: 2px;
      background: #ddd;
    }

    .bar-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      position: relative;
    }

    .bar-value {
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .bar {
      width: 90px;
      border-radius: 6px 6px 0 0;
      position: relative;
    }

    .bar-red  { background: #e53935; height: 240px; }
    .bar-green { background: #43a047; height: 40px; }

    .bar-label {
      font-size: 0.78rem;
      color: #555;
      text-align: center;
      max-width: 110px;
      line-height: 1.4;
    }

    /* Gap annotation */
    .gap-annotation {
      position: absolute;
      /* align with left edge of red bar group */
      left: 44px;   /* bar-group starts at 0, bar is 90px wide, center ~45px */
      top: 50px;    /* roughly mid-point of the gap */
      display: flex;
      align-items: flex-start;
      gap: 8px;
      pointer-events: none;
    }

    .gap-brace {
      width: 18px;
      height: 200px;   /* 240px red bar - 40px green bar */
      border: 2.5px solid #e53935;
      border-right: none;
      border-radius: 4px 0 0 4px;
    }

    .gap-text {
      display: flex;
      flex-direction: column;
      justify-content: center;
      height: 200px;
    }

    .gap-number {
      font-size: 2rem;
      font-weight: 900;
      color: #e53935;
      line-height: 1;
    }

    .gap-question {
      font-size: 0.88rem;
      font-weight: 600;
      color: #e53935;
      max-width: 160px;
      line-height: 1.35;
      margin-top: 4px;
    }

    .value-red   { color: #e53935; }
    .value-green { color: #43a047; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Africa's Annual Workforce Gap</h1>
    <p class="subtitle">New entrants vs. formal jobs created (per year)</p>

    <div class="chart">
      <!-- Red bar: 12 million new entrants -->
      <div class="bar-group">
        <span class="bar-value value-red">12M</span>
        <div class="bar bar-red"></div>
        <span class="bar-label">New workforce<br>entrants per year</span>

        <!-- Gap brace + label sits here, offset to the right of the red bar -->
        <div class="gap-annotation" style="left: 98px; top: 50px;">
          <div class="gap-brace"></div>
          <div class="gap-text">
            <span class="gap-number">10M</span>
            <span class="gap-question">Where do 10 million<br>people go every year?</span>
          </div>
        </div>
      </div>

      <!-- Green bar: 2 million formal jobs -->
      <div class="bar-group">
        <span class="bar-value value-green">2M</span>
        <div class="bar bar-green"></div>
        <span class="bar-label">Formal jobs<br>created per year</span>
      </div>
    </div>
  </div>
</body>
</html>
